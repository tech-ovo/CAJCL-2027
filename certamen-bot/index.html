<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Certamen Arena · 72nd CAJCL State Convention</title>
    <meta name="description" content="Certamen practice for the 72nd CAJCL State Convention: buzz on tossups and boni, track your accuracy by subject, and compare scores." />
    <!-- tokens.css, app.css, the fonts and the favicon are the convention
         site's own, linked from one level up by vite.config.ts. -->

    <!-- The theme, before the first paint. The same key as the convention
         site, and the same origin, so a choice made on either page holds on
         both. -->
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || t === "light") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) { /* private mode; the system preference still applies */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
